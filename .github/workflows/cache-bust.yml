name: Cache Bust

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update version in HTML
        run: |
          VERSION=$(date +%s)
          sed -i "s/script\.js?v=[0-9]*/script.js?v=$VERSION/g" index.html
          sed -i "s/style\.css?v=[0-9]*/style.css?v=$VERSION/g" index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No changes"
          else
            git add index.html
            git commit -m "Auto cache bust"
            git push
          fi